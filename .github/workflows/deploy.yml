name: Deploy React App
on:
  push:
    branches: [ "build" ]
  pull_request:
    branches: [ "build" ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  
          cache: 'npm'

      - name: Install dependencies
        run: npm install  

      - name: Build project
        run: npm run build
        env:
          CI: false
          PUBLIC_URL: https://aideteam.github.io/website

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
